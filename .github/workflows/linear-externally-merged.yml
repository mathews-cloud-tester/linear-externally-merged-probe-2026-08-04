name: linear-externally-merged

# MUST live on the Graphite MQ trunk (Clay: merge-queue-testing / whatever
# Graphite is configured to merge into). `push` workflows run from that branch.
on:
  push:
    branches:
      - testing

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-source-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Label Graphite-landed source PRs externally-merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRUNK_SHA: ${{ github.sha }}
          TRUNK_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LABEL=externally-merged
          gh label create "$LABEL" --color 0E8A16 --description "Linear custom merge queue marker" 2>/dev/null || true

          # Graphite FF sets trunk == [Graphite MQ] draft head, then closes source PRs.
          # At push time the draft is already closed and source PRs are usually still open.
          drafts=$(gh pr list --repo "$GH_REPO" --state closed --base "$TRUNK_REF" --limit 50 \
            --json number,title,headRefOid,headRefName,body)

          nums=$(jq -r --arg sha "$TRUNK_SHA" '
              .[]
              | select((.title | startswith("[Graphite MQ]")) or (.headRefName | startswith("gtmq_")))
              | select(.headRefOid == $sha)
              | [.title, (.body // "")] | @tsv
            ' <<<"$drafts")

          if [[ -z "${nums}" ]]; then
            echo "No closed Graphite MQ draft with head $TRUNK_SHA on $TRUNK_REF"
            exit 0
          fi

          echo "Matched MQ draft metadata:"
          echo "$nums"

          {
            while IFS=$'\t' read -r title body; do
              re='\(PRs[[:space:]]*([^)]+)\)'
              if [[ "$title" =~ $re ]]; then
                echo "${BASH_REMATCH[1]}" | tr ',' '\n' | tr -d ' '
              fi
              grep -oE '#[0-9]+' <<<"$body" | tr -d '#' || true
            done <<<"$nums"
          } | awk 'NF && $0 ~ /^[0-9]+$/ && !seen[$0]++' | tee /tmp/to-label.txt

          if [ ! -s /tmp/to-label.txt ]; then
            echo "Draft matched but no source PR numbers parsed"
            exit 0
          fi

          while read -r n; do
            state=$(gh pr view "$n" --repo "$GH_REPO" --json state --jq .state)
            if [[ "$state" == "MERGED" ]]; then
              echo "Skipping #${n} (already merged in GitHub)"
              continue
            fi
            echo "Adding ${LABEL} to #${n} (state=${state})"
            gh pr edit "$n" --repo "$GH_REPO" --add-label "$LABEL"
          done < /tmp/to-label.txt
